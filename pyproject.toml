[project]
name = "gb-bm-data"
version = "0.2.0"
description = "Python client for historical GB balancing-mechanism data (Elexon BMRS, NESO and Carbon Intensity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/KNHNF/gb-bm-data"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gb_bm_data*"]
